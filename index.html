  <meta charset="UTF-8">

  <style>

    body {

      padding: 20px;
      background:
        radial-gradient(circle at top, #222 0%, #08080a 60%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #121214;
      border: 1px solid #ffffff15;
      border-radius: 24px;

      box-shadow: 0 25px 80px #000;

    .logo {
      text-align: center;

    input {

      padding: 0 14px;
      border-radius: 12px;

      outline: none;

    input:focus {
      border-color: #ffffff45;
    }

      font-family: inherit;

    .main-btn,

      width: 100%;

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;

      flex: 1;
    }

    .switch {
      text-align: center;
      margin-top: 20px;

    .switch button {

      display: none;
      margin-top: 15px;
      padding: 12px;

    /* CHAT */

    #chat {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 65px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111113;
      border-bottom: 1px solid #ffffff12;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;

    }

    .account {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #aaa;
    }

    .logout {
      border: 1px solid #ffffff20;

    }

    .message {
      max-width: 900px;

    }

    .ai .bubble {
      background: #171719;

    }

    .composer {
      padding: 12px 20px 22px;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;

      border-radius: 18px;
      background: #18181b;
      border: 1px solid #ffffff12;
    }

    textarea {
      flex: 1;
      height: 52px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 13px;

    }

    .send-btn {
      width: 90px;
      border: none;
      border-radius: 13px;
      background: white;
      color: black;

      cursor: pointer;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px 20px;
      }

      .messages {
        padding: 15px 8px;
      }

      .composer {
        padding: 8px;
      }

      .account span {
        display: none;
      }
    }
  </style>
</head>


<body>

  <!-- LOGIN PAGE -->

  <section id="auth">

    <div class="card">

      <div class="logo">
        MAZYAR
      </div>

      <div class="subtitle">
        هاوڕێی زیرەکی دەستکرد 🤖
      </div>


      <div id="usernameBox" class="hidden">

        <label>
          ناوی بەکارهێنەر
        </label>

        <input
          id="username"
          type="text"
          placeholder="ناوی تۆ">

      </div>


      <label>
        ئیمەیڵ
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="example@gmail.com">


      <label>
        پاسوۆرد
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••">


      <button
        id="authBtn"
        class="main-btn">
        چوونەژوورەوە
      </button>


      <div class="divider">
        یان
      </div>


      <button
        id="googleBtn"
        class="google-btn">
        Continue with Google
      </button>


      <div
        id="error"
        class="error">
      </div>


      <div class="switch">

        <span id="switchText">
          هەژمارت نییە؟
        </span>

        <button id="switchBtn">
          هەژمار دروست بکە
        </button>

      </div>

    </div>

  </section>


  <!-- CHAT PAGE -->

  <section
    id="chat"
    class="hidden">

    <header class="header">

      <div class="brand">
        MAZYAR AI
      </div>

      <div class="account">

        <span id="userName"></span>

        <button
          id="logoutBtn"
          class="logout">
          دەرچوون
        </button>

      </div>

    </header>


    <main
      id="messages"
      class="messages">

      <div class="message ai">

        <div class="bubble">
          سڵاو 👋 من MAZYAR ـم.
          <br>
          بەخێربێیت! چ پرسیارێکت هەیە؟
        </div>

      </div>

    </main>


    <footer class="composer">

      <div class="input-box">

        <textarea
          id="question"
          placeholder="پرسیارەکەت بنووسە...">
        </textarea>

        <button
          id="sendBtn"
          class="send-btn">
          ناردن
        </button>

      </div>

    </footer>

  </section>


  <!-- SUPABASE + JAVASCRIPT -->

  <script type="module">

    import {
      createClient
    } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /*
      SUPABASE
    */

    const SUPABASE_URL =
      "https://lwqdpovamqdmdqftewop.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KRRdhD9dmvwzHZwsmBXbhA_ACxwSR2T";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "pkce"
          }
        }
      );


    /*
      ELEMENTS
    */

    const authPage =
      document.getElementById("auth");

    const chatPage =
      document.getElementById("chat");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const username =
      document.getElementById("username");

    const usernameBox =
      document.getElementById("usernameBox");

    const authBtn =
      document.getElementById("authBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const errorBox =
      document.getElementById("error");

    const switchBtn =
      document.getElementById("switchBtn");

    const switchText =
      document.getElementById("switchText");

    const userName =
      document.getElementById("userName");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const question =
      document.getElementById("question");

    const sendBtn =
      document.getElementById("sendBtn");

    const messages =
      document.getElementById("messages");


    let signUpMode = false;


    /*
      ERROR
    */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

    }


    function clearError() {

      errorBox.textContent =
        "";

      errorBox.style.display =
        "none";

    }


    /*
      SHOW CHAT
    */

    function showChat(user) {

      authPage.classList.add("hidden");

      chatPage.classList.remove("hidden");


      const name =
        user?.user_metadata?.full_name ||
        user?.user_metadata?.name ||
        user?.user_metadata?.username ||
        user?.email?.split("@")[0] ||
        "User";


      userName.textContent =
        name;

    }


    /*
      SHOW LOGIN
    */

    function showLogin() {

      chatPage.classList.add("hidden");

      authPage.classList.remove("hidden");

    }


    /*
      LOGIN / SIGN UP SWITCH
    */

    switchBtn.addEventListener(
      "click",
      () => {

        signUpMode =
          !signUpMode;


        usernameBox.classList.toggle(
          "hidden",
          !signUpMode
        );


        authBtn.textContent =
          signUpMode
            ? "هەژمار دروست بکە"
            : "چوونەژوورەوە";


        switchText.textContent =
          signUpMode
            ? "هەژمارت هەیە؟"
            : "هەژمارت نییە؟";


        switchBtn.textContent =
          signUpMode
            ? "چوونەژوورەوە"
            : "هەژمار دروست بکە";

      }
    );


    /*
      EMAIL LOGIN
    */

    authBtn.addEventListener(
      "click",
      async () => {

        clearError();


        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;

        const usernameValue =
          username.value.trim();


        if (!emailValue) {

          showError(
            "ئیمەیڵ بنووسە."
          );

          return;

        }


        if (!passwordValue) {

          showError(
            "پاسوۆرد بنووسە."
          );

          return;

        }


        authBtn.disabled =
          true;

        authBtn.textContent =
          "چاوەڕێ بکە...";


        try {


          if (signUpMode) {


            if (!usernameValue) {

              throw new Error(
                "ناوی بەکارهێنەر بنووسە."
              );

            }


            const {
              data,
              error
            } =
            await supabase.auth.signUp({

              email:
                emailValue,

              password:
                passwordValue,

              options: {

                data: {
                  username:
                    usernameValue
                },

                emailRedirectTo:
                  "https://mazyar.vercel.app/"

              }

            });


            if (error)
              throw error;


            if (data.session) {

              showChat(
                data.user
              );

            } else {

              showError(
                "هەژمار دروست بوو. تکایە ئیمەیڵەکەت پشتڕاست بکە."
              );

            }


          } else {


            const {
              data,
              error
            } =
            await supabase.auth.signInWithPassword({

              email:
                emailValue,

              password:
                passwordValue

            });


            if (error)
              throw error;


            showChat(
              data.user
            );

          }


        } catch (error) {

          console.error(error);

          showError(
            error.message ||
            "هەڵەیەک ڕوویدا."
          );

        }


        authBtn.disabled =
          false;

        authBtn.textContent =
          signUpMode
            ? "هەژمار دروست بکە"
            : "چوونەژوورەوە";

      }
    );


    /*
      GOOGLE LOGIN
    */

    googleBtn.addEventListener(
      "click",
      async () => {

        clearError();

        googleBtn.disabled =
          true;

        googleBtn.textContent =
          "چاوەڕێ بکە...";


        try {


          const {
            error
          } =
          await supabase.auth.signInWithOAuth({

            provider:
              "google",

            options: {

              redirectTo:
                "https://mazyar.vercel.app/",

              queryParams: {

                prompt:
                  "select_account"

              }

            }

          });


          if (error)
            throw error;


        } catch (error) {

          console.error(error);

          showError(
            error.message ||
            "Google Login هەڵەی هەیە."
          );

          googleBtn.disabled =
            false;

          googleBtn.textContent =
            "Continue with Google";

        }

      }
    );


    /*
      AUTH STATE
    */

    supabase.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth:",
          event
        );


        if (
          session &&
          session.user
        ) {

          showChat(
            session.user
          );

        } else {

          showLogin();

        }

      }
    );


    /*
      CHECK SESSION
    */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
        await supabase.auth.getSession();


        if (error)
          throw error;


        if (
          data.session &&
          data.session.user
        ) {

          showChat(
            data.session.user
          );

        } else {

          showLogin();

        }

      } catch (error) {

        console.error(error);

        showLogin();

      }

    }


    checkSession();


    /*
      LOGOUT
    */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        showLogin();

      }
    );


    /*
      ADD MESSAGE
    */

    function addMessage(
      text,
      type
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "message " + type;


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      row.appendChild(
        bubble
      );

      messages.appendChild(
        row
      );


      messages.scrollTop =
        messages.scrollHeight;


      return bubble;

    }


    /*
      SEND MESSAGE TO AI
    */

    async function sendMessage() {

      const text =
        question.value.trim();


      if (!text)
        return;


      addMessage(
        text,
        "user"
      );


      question.value =
        "";


      const answer =
        addMessage(
          "MAZYAR خەریکی بیرکردنەوەیە... 🤖",
          "ai"
        );


      try {


        const response =
          await fetch(
            "/api/chat",
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  message:
                    text

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "AI Error"
          );

        }


        answer.textContent =
          data.answer ||
          "وەڵامێک نەهاتەوە.";


      } catch (error) {

        console.error(error);

        answer.textContent =
          "ببورە، کێشەیەک لە پەیوەندی بە AI هەیە.";

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /*
      ENTER TO SEND
    */

    question.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
