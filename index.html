<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --chat-user-bg: #2563eb;
      --chat-bot-bg: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Auth Screen UI */
    .auth-container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-google {
      background-color: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1rem;
    }

    .btn-google:hover {
      background-color: #e6e6e6;
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      position: relative;
    }

    /* Chat Screen UI */
    .chat-container {
      display: none; /* شاردنەوە لە سەرەتادا */
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 75%;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-start;
      background-color: var(--chat-user-bg);
      color: white;
    }

    .message.bot {
      align-self: flex-end;
      background-color: var(--chat-bot-bg);
      color: var(--text-color);
    }

    .chat-input-area {
      padding: 1rem;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .chat-input-area button {
      width: auto;
      padding: 0 1.5rem;
    }

    .logout-btn {
      background-color: #ef4444;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 1. شاشەی چوونەژوورەوە (Login Screen) -->
  <div class="auth-container" id="authScreen">
    <h2>چوونەژوورەوە</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">ئیمەیڵ</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label for="password">وشەی نهێنی</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">چوونەژوورەوە</button>
    </form>

    <div class="divider">یان</div>

    <button class="btn btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29c-.8 1.6-1.25 3.37-1.25 5.42s.45 3.82 1.25 5.42l3.99-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
      چوونەژوورەوە بە Google
    </button>
  </div>

  <!-- 2. شاشەی چات (Chat Screen) -->
  <div class="chat-container" id="chatScreen">
    <div class="chat-header">
      <h3>AI Assistant</h3>
      <button class="btn logout-btn" id="logoutBtn">دەچوونه‌ده‌ره‌وە</button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">سڵاو! من ژیریی دەستکردم. چۆن دەتوانم هاوکاریت بکەم؟</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="پەیامەکەت بنووسە...">
      <button class="btn" id="sendBtn">ناردن</button>
    </div>
  </div>

  <!-- 3. لۆجیکی جافاسکریپت (JavaScript) -->
  <script>
    const authScreen = document.getElementById('authScreen');
    const chatScreen = document.getElementById('chatScreen');
    const loginForm = document.getElementById('loginForm');
    const googleBtn = document.getElementById('googleBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // کرداری چوونەژوورەوە
    function handleLogin(e) {
      if(e) e.preventDefault();
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
    }

    loginForm.addEventListener('submit', handleLogin);
    googleBtn.addEventListener('click', handleLogin);

    // دەرچوون
    logoutBtn.addEventListener('click', () => {
      chatScreen.style.display = 'none';
      authScreen.style.display = 'block';
    });

    // ناردنی پەیام لە چاتدا
    function sendMessage() {
      const text = userInput.value.trim();
      if (text === '') return;

      // پەیامی بەکارهێنەر
      appendMessage(text, 'user');
      userInput.value = '';

      // وەڵامی دروستکراوی AI (بۆ تاقیکردنەوە)
      setTimeout(() => {
        appendMessage('ئەمە وەڵامێکی نائۆتۆماتیکی نموونەیییە. لە پاشەڕۆژدا دەتوانیت ئەم بەشە بە APIی ڕاستەقینە ببه‌ستیتەوە.', 'bot');
      }, 800);
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
