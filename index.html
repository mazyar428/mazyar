```html
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZYAR AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
  linear-gradient(135deg,#0009,#0005,#000b),
  url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=90")
  center/cover fixed;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:min(1050px,100%);
  min-height:620px;
  display:grid;
  grid-template-columns:1fr 430px;
  overflow:hidden;
  border-radius:30px;
  background:#0009;
  backdrop-filter:blur(25px);
  border:1px solid #ffffff20;
  box-shadow:0 30px 80px #0009;
}

.info{
  padding:70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  font-size:58px;
  font-weight:900;
  letter-spacing:5px;
}

.subtitle{
  margin-top:15px;
  color:#ddd;
  font-size:23px;
  line-height:1.8;
}

.features{
  margin-top:35px;
  display:grid;
  gap:16px;
}

.feature{
  color:#ddd;
  font-size:16px;
}

.login{
  padding:45px 35px;
  background:#0007;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h2{
  margin:0;
  font-size:30px;
}

.desc{
  color:#999;
  margin:10px 0 28px;
}

label{
  display:block;
  margin:12px 0 7px;
  color:#ddd;
  font-size:14px;
}

input{
  width:100%;
  height:52px;
  padding:0 15px;
  border-radius:13px;
  border:1px solid #ffffff20;
  outline:none;
  background:#ffffff0d;
  color:white;
  font-size:15px;
}

input:focus{
  border-color:#ffffff70;
  background:#ffffff12;
}

button{
  cursor:pointer;
}

.main{
  width:100%;
  height:53px;
  margin-top:22px;
  border:0;
  border-radius:14px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

.switch{
  text-align:center;
  margin-top:22px;
  color:#888;
}

.switch button{
  border:0;
  background:none;
  color:white;
  font-weight:bold;
}

.message{
  display:none;
  padding:11px;
  margin-bottom:10px;
  border-radius:10px;
  background:#ffffff10;
  color:#ddd;
  font-size:13px;
}

@media(max-width:800px){
  .box{grid-template-columns:1fr}
  .info{
    padding:40px 25px;
    text-align:center;
  }
  .logo{font-size:42px}
  .subtitle{font-size:18px}
  .login{padding:35px 25px}
}
</style>
</head>

<body>

<div class="page">

<div class="box">

<section class="info">

<div class="logo">MAZYAR</div>

<div class="subtitle">
هاوڕێی زیرەکی دەستکردی کوردی 🤖
<br>
هەمیشە لەگەڵتە.
</div>

<div class="features">
<div class="feature">🎙️ قسەکردن بە دەنگ</div>
<div class="feature">🧠 زیرەکی دەستکرد</div>
<div class="feature">🌐 گەڕان و زانیاری</div>
<div class="feature">❤️ وەک هاوڕێ لەگەڵت</div>
</div>

</section>


<section class="login">

<h2 id="title">بەخێربێیت</h2>

<div class="desc" id="desc">
بچۆ ژوورەوە بۆ MAZYAR AI
</div>

<div class="message" id="message"></div>


<div id="usernameBox">

<label>ناوی بەکارهێنەر</label>

<input
id="username"
type="text"
placeholder="ناوی تۆ"
>

</div>


<label>ئیمەیڵ</label>

<input
id="email"
type="email"
placeholder="example@email.com"
>


<label>پاسوۆرد</label>

<input
id="password"
type="password"
placeholder="••••••••"
>


<button class="main" onclick="submitForm()" id="mainButton">
چوونەژوورەوە
</button>


<div class="switch">

<span id="switchText">
هەژمارت نییە؟
</span>

<button onclick="changeMode()" id="switchButton">
هەژمار دروست بکە
</button>

</div>

</section>

</div>
</div>


<script>

let signup = false;

const title =
document.getElementById("title");

const desc =
document.getElementById("desc");

const usernameBox =
document.getElementById("usernameBox");

const mainButton =
document.getElementById("mainButton");

const switchText =
document.getElementById("switchText");

const switchButton =
document.getElementById("switchButton");

const message =
document.getElementById("message");


function changeMode(){

signup = !signup;

if(signup){

title.textContent =
"هەژمار دروست بکە";

desc.textContent =
"هەژمارێکی نوێ بۆ MAZYAR AI دروست بکە";

mainButton.textContent =
"دروستکردنی هەژمار";

switchText.textContent =
"هەژمارت هەیە؟";

switchButton.textContent =
"چوونەژوورەوە";

usernameBox.style.display =
"block";

}else{

title.textContent =
"بەخێربێیت";

desc.textContent =
"بچۆ ژوورەوە بۆ MAZYAR AI";

mainButton.textContent =
"چوونەژوورەوە";

switchText.textContent =
"هەژمارت نییە؟";

switchButton.textContent =
"هەژمار دروست بکە";

usernameBox.style.display =
"block";

}

}


function showMessage(text){

message.style.display="block";

message.textContent=text;

}


function submitForm(){

const username =
document.getElementById("username").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value.trim();


if(!email || !password){

showMessage(
"تکایە ئیمەیڵ و پاسوۆرد پڕبکەرەوە."
);

return;

}


if(signup && !username){

showMessage(
"تکایە ناوی بەکارهێنەر بنووسە."
);

return;

}


/*
  ئەمە شوێنی Authentication ـی ڕاستەقینەیە.

  لە هەنگاوی دواتر:
  Supabase Auth
  + Database
  زیاد دەکەین.

  Password نابێت لە localStorage
  یان GitHub هەڵبگیرێت.
*/


if(signup){

showMessage(
"هەموو زانیارییەکان ئامادەن. ئێستا پێویستە Authentication ـی ڕاستەقینە پێوە ببەستین."
);

}else{

showMessage(
"ئێستا پێویستە Login ـی ڕاستەقینە پێوە ببەستین."
);

}

}

</script>

</body>
</html>
