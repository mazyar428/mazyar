      margin: 0;

<body>

<div class="page">

  <header>
    <div class="logo">MAZYAR AI</div>
    <button class="login" onclick="login()">
      Login
    </button>
  </header>

  <main>

    <section class="welcome">
      <h1>MAZYAR</h1>
      <p>هاوڕێی زیرەکی دەستکردی کوردی 🤖</p>
    </section>

    <section class="chat" id="chat">

      <div class="message ai">
        سڵاو 👋 من MAZYAR ـم.
        <br>
        چۆنی؟ چیت پێویستە؟
        <br>
        دەتوانیت بنووسیت یان بە دەنگ قسەم لەگەڵ بکەیت 🎙️
      </div>

    </section>

    <div class="controls">

      <input
        id="input"
        placeholder="لەگەڵ MAZYAR قسە بکە..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button class="btn voice" id="voiceBtn" onclick="startVoice()">
        🎙️
      </button>

      <button class="btn" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </main>

  <footer>
    MAZYAR AI © 2026
  </footer>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const voiceBtn = document.getElementById("voiceBtn");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {

    addMessage(
      "بەڵێ مازیار ❤️ پرسیارەکەت وەرگرت. لە وەشانی داهاتوودا AI ـی ڕاستەقینە و web search ـیش پێوە دەبەستین.",
      "ai"
    );

    speak(
      "بەڵێ مازیار. پرسیارەکەت وەرگرت."
    );

  }, 500);
}

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "ku";

  voice.rate = 0.95;

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(voice);
}

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Browser ـەکەت voice recognition پشتگیری ناکات."
    );

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "ku-IQ";

  recognition.interimResults = false;

  voiceBtn.classList.add("active");

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    sendMessage();
  };

  recognition.onerror = function() {

    voiceBtn.classList.remove("active");

  };

  recognition.onend = function() {

    voiceBtn.classList.remove("active");

  };
}

function login() {

  alert(
    "Google Login ـی ڕاستەقینە لە هەنگاوی دواتر زیاد دەکرێت."
  );

}

</script>

</body>
</html>
