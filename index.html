<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";

const SUPABASE_KEY =
"sb_publishable_KRRdhD9dmvwzHZwsmBXbhA_ACxwSR2T";

const supabase =
createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   UI
   ========================= */

let signup = false;

const title = document.getElementById("title");
const desc = document.getElementById("desc");
const usernameBox = document.getElementById("usernameBox");
const mainButton = document.getElementById("mainButton");
const switchText = document.getElementById("switchText");
const switchButton = document.getElementById("switchButton");
const message = document.getElementById("message");


function showMessage(text){
message.style.display="block";
message.textContent=text;
}


function changeMode(){

signup=!signup;

if(signup){

title.textContent="هەژمار دروست بکە";
desc.textContent="هەژمارێکی نوێ بۆ MAZYAR AI دروست بکە";
mainButton.textContent="دروستکردنی هەژمار";
switchText.textContent="هەژمارت هەیە؟";
switchButton.textContent="چوونەژوورەوە";

}else{

title.textContent="بەخێربێیت";
desc.textContent="بچۆ ژوورەوە بۆ MAZYAR AI";
mainButton.textContent="چوونەژوورەوە";
switchText.textContent="هەژمارت نییە؟";
switchButton.textContent="هەژمار دروست بکە";

}

}


/* =========================
   SIGN UP / LOGIN
   ========================= */

window.submitForm = async function(){

const username =
document.getElementById("username").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
showMessage("تکایە ئیمەیڵ و پاسوۆرد پڕبکەرەوە.");
return;
}

if(signup && !username){
showMessage("تکایە ناوی بەکارهێنەر بنووسە.");
return;
}

mainButton.disabled=true;
mainButton.textContent="چاوەڕێ بکە...";


try{

if(signup){

const {data,error} =
await supabase.auth.signUp({

email:email,
password:password,

options:{
data:{
username:username
}
}

});

if(error) throw error;

showMessage(
"هەژمارەکەت دروست بوو 🎉 ئەگەر Email confirmation چالاکە، ئیمەیڵەکەت بپشکنە."
);

}else{

const {data,error} =
await supabase.auth.signInWithPassword({

email:email,
password:password

});

if(error) throw error;

showDashboard(data.user);

}

}catch(error){

showMessage(error.message);

}finally{

mainButton.disabled=false;

mainButton.textContent =
signup
?"دروستکردنی هەژمار"
:"چوونەژوورەوە";

}

};


/* =========================
   DASHBOARD
   ========================= */

function showDashboard(user){

const username =
user.user_metadata?.username || "هاوڕێ";

document.getElementById("app").innerHTML=`

<div class="dashboard">

<h2>سڵاو ${escapeHTML(username)} 👋</h2>

<div class="desc">
بەخێربێیت بۆ MAZYAR AI
<br>
ئێستا هەژمارەکەت بە سەرکەوتوویی چووە ژوورەوە.
</div>

<button class="logout" id="logoutButton">
چوونەدەرەوە
</button>

</div>
`;

document
.getElementById("logoutButton")
.addEventListener("click",logout);

}


/* =========================
   LOGOUT
   ========================= */

async function logout(){

await supabase.auth.signOut();

location.reload();

}


/* =========================
   SECURITY
   ========================= */

function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   CHECK EXISTING SESSION
   ========================= */

const {
data:{session}
}=await supabase.auth.getSession();

if(session){

showDashboard(session.user);

}

</script>

</body>
