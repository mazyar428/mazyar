```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZYAR Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MAZYAR</div>
  <input id="search" type="search" placeholder="Search products...">
  <button onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button>
</header>

<section class="hero">
  <h1>MAZYAR STORE</h1>
  <p>Quality products. Simple shopping.</p>
</section>

<main>
  <h2>Products</h2>
  <div id="products" class="products"></div>
</main>

<div id="cartModal" class="modal">
  <div class="cart">
    <button class="close" onclick="closeCart()">✕</button>
    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: $<span id="total">0.00</span>
    </div>

    <button class="checkout" onclick="checkout()">
      Checkout
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
```
