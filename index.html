```html
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZYAR AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:#09090b;
color:white;
}

button,input,textarea{
font-family:inherit;
}

.hidden{
display:none!important;
}

/* LOGIN */

.loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
linear-gradient(#0008,#000b),
url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=90")
center/cover;
}

.loginBox{
width:430px;
max-width:100%;
padding:40px;
border-radius:25px;
background:#111a;
backdrop-filter:blur(25px);
border:1px solid #ffffff18;
box-shadow:0 30px 80px #000;
}

.logo{
font-size:42px;

letter-spacing:4px;
text-align:center;
}

.tag{
text-align:center;

}

label{

color:#ccc;
font-size:14px;
}

input{
width:100%;
height:50px;
border-radius:12px;
border:1px solid #ffffff18;
background:#ffffff0b;
color:white;
outline:none;
padding:0 15px;
}

input:focus{
border-color:#ffffff70;
}

.primary{
width:100%;
height:50px;
margin-top:20px;
border:0;

background:white;

}

.primary:disabled{
opacity:.5;
}

.switch{
text-align:center;
margin-top:20px;
color:#888;
}

.switch button{
border:0;
background:none;
color:white;
font-weight:bold;
cursor:pointer;
}

.error{
margin-top:15px;
padding:10px;
border-radius:10px;
background:#ff000018;
color:#ffb0b0;
display:none;
font-size:14px;
}

/* CHAT */

.chatPage{
height:100vh;
display:flex;
flex-direction:column;
background:#0b0b0d;
}

.topbar{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #ffffff12;
background:#111114;
}

.brand{
font-size:22px;

}

.userArea{

}

.username{

}

.logout{

}

.messages{

}

.message{

}

}

}

.bubble{

}

.user .bubble{
background:#252529;
}

.ai .bubble{
background:#171719;
border:1px solid #ffffff10;
}

.composer{
padding:15px 25px 25px;
}

.inputWrap{
max-width:900px;

}

textarea{

.send{

.loginBox{
padding:28px 20px;
}

padding:15px 10px;
}

.composer{

}

.username{

}

</style>
</head>

<body>


<!-- LOGIN -->

<section id="loginPage" class="loginPage">

<div class="loginBox">

<div class="logo">
MAZYAR
</div>

<div class="tag" id="authDescription">
هاوڕێی زیرەکی دەستکردی کوردی 🤖
</div>


<div id="signupFields" class="hidden">

<label>
ناوی بەکارهێنەر
</label>

<input
id="usernameInput"
type="text"
placeholder="ناوی تۆ"
>

</div>


<label>
ئیمەیڵ
</label>

<input
id="emailInput"
type="email"
placeholder="example@email.com"
>


<label>
پاسوۆرد
</label>

<input
id="passwordInput"
type="password"
placeholder="••••••••"
>


<button
id="authButton"
class="primary"
onclick="authenticate()">

چوونەژوورەوە

</button>


<div id="error" class="error"></div>


<div class="switch">

<span id="switchLabel">
هەژمارت نییە؟
</span>

<button onclick="toggleAuth()">
<span id="switchButton">
هەژمار دروست بکە
</span>
</button>

</div>

</div>

</section>


<!-- CHAT -->

<section id="chatPage" class="chatPage hidden">

<header class="topbar">

<div class="brand">
MAZYAR
</div>

<div class="userArea">

<div id="currentUsername" class="username"></div>

<button
class="logout"
onclick="logout()">

دەرچوون

</button>

</div>

</header>


<main
id="messages"
class="messages">

<div class="message ai">

<div class="bubble">
سڵاو 👋 من MAZYAR ـم.
<br>
بەخێربێیت! چیت دەوێت بزانیت؟
</div>

</div>

</main>


<footer class="composer">

<div class="inputWrap">

<textarea
id="messageInput"
placeholder="پرسیارێکت بنووسە..."
onkeydown="handleKey(event)"
></textarea>

<button
id="sendButton"
class="send"
onclick="sendMessage()">

ناردن

</button>

</div>

</footer>

</section>


<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://lwqdpovamqdmdqftewop.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KRRdhD9dmvwzHZwsmBXbhA_ACxwSR2T";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==========================
   AUTH MODE
========================== */

let signupMode=false;


window.toggleAuth=function(){

signupMode=!signupMode;

document
.getElementById("signupFields")
.classList
.toggle("hidden",!signupMode);

document
.getElementById("authButton")
.textContent=
signupMode
?"دروستکردنی هەژمار"
:"چوونەژوورەوە";

document
.getElementById("switchLabel")
.textContent=
signupMode
?"هەژمارت هەیە؟"
:"هەژمارت نییە؟";

document
.getElementById("switchButton")
.textContent=
signupMode
?"چوونەژوورەوە"
:"هەژمار دروست بکە";

};


/* ==========================
   MESSAGE
========================== */

function showError(text){

const box=
document.getElementById("error");

box.textContent=text;
box.style.display="block";

}


function hideError(){

document
.getElementById("error")
.style.display="none";

}


/* ==========================
   AUTHENTICATE
========================== */

window.authenticate=async function(){

hideError();

const email=
document
.getElementById("emailInput")
.value
.trim();

const password=
document
.getElementById("passwordInput")
.value;

const username=
document
.getElementById("usernameInput")
.value
.trim();


if(!email || !password){

showError(
"تکایە ئیمەیڵ و پاسوۆرد پڕبکەرەوە."
);

return;

}


if(signupMode && !username){

showError(
"تکایە ناوی بەکارهێنەر بنووسە."
);

return;

}


const button=
document.getElementById("authButton");

button.disabled=true;
button.textContent="چاوەڕێ بکە...";


try{


if(signupMode){

const {
data,
error
}=
await supabase.auth.signUp({

email,
password,

options:{
data:{
username
}
}

});


if(error)
throw error;


if(data.session){

openChat(data.user);

}else{

showError(
"هەژمارەکەت دروست بوو. ئیمەیڵەکەت بپشکنە بۆ پشتڕاستکردنەوە."
);

}

}else{


const {
data,
error
}=
await supabase.auth.signInWithPassword({

email,
password

});


if(error)
throw error;


openChat(data.user);

}


}catch(error){

showError(
error.message
);

}


button.disabled=false;

button.textContent=
signupMode
?"دروستکردنی هەژمار"
:"چوونەژوورەوە";

};


/* ==========================
   OPEN CHAT
========================== */

function openChat(user){

document
.getElementById("loginPage")
.classList
.add("hidden");

document
.getElementById("chatPage")
.classList
.remove("hidden");


const username=
user.user_metadata?.username
||
user.email?.split("@")[0]
||
"هاوڕێ";


document
.getElementById("currentUsername")
.textContent=
username;

}


/* ==========================
   LOGOUT
========================== */

window.logout=async function(){

await supabase.auth.signOut();

document
.getElementById("chatPage")
.classList
.add("hidden");

document
.getElementById("loginPage")
.classList
.remove("hidden");

};


/* ==========================
   CHAT
========================== */

function addMessage(text,type){

const row=
document.createElement("div");

row.className=
"message "+type;

const bubble=
document.createElement("div");

bubble.className="bubble";

bubble.textContent=text;

row.appendChild(bubble);

document
.getElementById("messages")
.appendChild(row);

const messages=
document.getElementById("messages");

messages.scrollTop=
messages.scrollHeight;

return bubble;

}


window.sendMessage=function(){

const input=
document.getElementById("messageInput");

const text=
input.value.trim();

if(!text)
return;


addMessage(text,"user");

input.value="";


const aiBubble=
addMessage(
"MAZYAR خەریکی بیرکردنەوەیە... 🤖",
"ai"
);


setTimeout(()=>{

aiBubble.textContent=
"تێگەیشتم: "+text+
"\n\nئەمە تەنها وەشانی بنەڕەتی MAZYAR ـە. بۆ ئەوەی بە ڕاستی وەک ChatGPT وەڵام بدات، پێویستە AI API لە پشتەوە پێوە ببەسترێت.";

},700);

};


window.handleKey=function(event){

if(event.key==="Enter" && !event.shiftKey){

event.preventDefault();

sendMessage();

}

};


/* ==========================
   AUTO LOGIN
========================== */

const {
data:{
session
}
}=
await supabase.auth.getSession();


if(session){

openChat(session.user);

}

</script>

</body>
</html>
