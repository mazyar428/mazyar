```html
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAZYAR AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      background:
        linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.78)),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=90")
        center / cover fixed;
    }

    header {
      height: 72px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(0,0,0,.45);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,.15);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .login {
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.12);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    main {
      width: min(900px, 92%);
      margin: auto;
      padding: 45px 0 30px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 85px);
      letter-spacing: 4px;
    }

    .welcome p {
      color: #ddd;
      font-size: 18px;
    }

    .chat {
      height: 430px;
      overflow-y: auto;
      padding: 20px;

      background: rgba(0,0,0,.48);
      backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 25px;
    }

    .message {
      max-width: 82%;
      padding: 14px 18px;
      margin: 12px 0;
      border-radius: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .ai {
      background: rgba(255,255,255,.12);
      margin-left: auto;
      margin-right: 0;
    }

    .user {
      background: rgba(255,255,255,.25);
      margin-right: auto;
      margin-left: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding: 10px;

      background: rgba(0,0,0,.55);
      backdrop-filter: blur(15px);
      border-radius: 18px;
    }

    #input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 13px;
      font-size: 16px;
    }

    #input::placeholder {
      color: #bbb;
    }

    .btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 19px;
    }

    .voice.active {
      background: #e53935;
      color: white;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 25px;
      }

      .chat {
        height: 50vh;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    MAZYAR AI
  </div>

  <button class="login" onclick="login()">
    چوونەژوورەوە
  </button>

</header>

<main>

  <section class="welcome">

    <h1>MAZYAR</h1>

    <p>
      هاوڕێی زیرەکی دەستکردی کوردی 🤖
    </p>

  </section>

  <section class="chat" id="chat">

    <div class="message ai">
      سڵاو 👋 من MAZYAR ـم.

      چۆنی؟ چیت پێویستە؟

      دەتوانیت بنووسیت یان بە دەنگ قسەم لەگەڵ بکەیت 🎙️
    </div>

  </section>

  <div class="controls">

    <input
      id="input"
      type="text"
      placeholder="لەگەڵ MAZYAR قسە بکە..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button
      class="btn voice"
      id="voiceBtn"
      onclick="startVoice()">
      🎙️
    </button>

    <button
      class="btn"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</main>

<footer>
  MAZYAR AI © 2026
</footer>


<script>

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const voiceBtn = document.getElementById("voiceBtn");


  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }


  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";


    setTimeout(() => {

      const answer =
        "بەڵێ ❤️ من MAZYAR ـم.\n\n" +
        "پرسیارەکەت وەرگرت. لە هەنگاوی دواتر AI ـی ڕاستەقینە بە من دەبەسترێت.";

      addMessage(answer, "ai");

      speak("بەڵێ مازیار. پرسیارەکەت وەرگرت.");

    }, 500);
  }


  function speak(text) {

    if (!("speechSynthesis" in window)) {
      return;
    }

    const speech =
      new SpeechSynthesisUtterance(text);

    speech.lang = "ku";

    speech.rate = 0.95;

    speech.pitch = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);
  }


  function startVoice() {

    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!Recognition) {

      alert(
        "Browser ـەکەت پشتگیری Voice Recognition ناکات."
      );

      return;
    }


    const recognition = new Recognition();

    recognition.lang = "ku-IQ";

    recognition.interimResults = false;

    recognition.continuous = false;


    voiceBtn.classList.add("active");

    recognition.start();


    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      input.value = text;

      sendMessage();
    };


    recognition.onerror = function() {

      voiceBtn.classList.remove("active");

    };


    recognition.onend = function() {

      voiceBtn.classList.remove("active");

    };
  }


  function login() {

    alert(
      "Google Login ـی ڕاستەقینە لە هەنگاوی دواتر زیاد دەکرێت."
    );

  }

</script>

</body>
</html>
