```html
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAZYAR AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;
background:#0b0b0d;
color:white;
display:flex;
flex-direction:column;
}

header{
height:70px;
display:flex;
align-items:center;
padding:0 25px;
border-bottom:1px solid #ffffff12;
background:#111114;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:3px;
}

.status{
margin-right:15px;
font-size:13px;
color:#777;
}

.chat{
flex:1;
overflow-y:auto;
padding:30px 15%;
}

.message{
display:flex;
margin:18px 0;
}

.user{
justify-content:flex-start;
}

.ai{
justify-content:flex-end;
}

.bubble{
max-width:750px;
padding:15px 18px;
border-radius:18px;
line-height:1.8;
white-space:pre-wrap;
}

.user .bubble{
background:#252529;
}

.ai .bubble{
background:#171719;
border:1px solid #ffffff0d;
}

.composer{
padding:20px 15%;
background:#0b0b0d;
}

.inputBox{
display:flex;
gap:10px;
background:#1b1b1f;
border:1px solid #ffffff15;
border-radius:18px;
padding:8px;
}

textarea{
flex:1;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
font-size:16px;
padding:12px;
height:50px;
font-family:inherit;
}

button{
border:0;
border-radius:13px;
background:white;
color:black;
font-weight:bold;
padding:0 20px;
cursor:pointer;
}

button:disabled{
opacity:.4;
}

@media(max-width:700px){
.chat,.composer{
padding-left:12px;
padding-right:12px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">MAZYAR</div>
<div class="status">AI Assistant</div>
</header>

<main class="chat" id="chat">

<div class="message ai">
<div class="bubble">
سڵاو 👋 من MAZYAR ـم.
چۆن دەتوانم یارمەتیت بدەم؟
</div>
</div>

</main>

<div class="composer">

<div class="inputBox">

<textarea
id="input"
placeholder="پرسیارێکت بنووسە..."
onkeydown="handleKey(event)"
></textarea>

<button
id="send"
onclick="sendMessage()"
>
ناردن
</button>

</div>

</div>


<script>

const input =
document.getElementById("input");

const chat =
document.getElementById("chat");

const send =
document.getElementById("send");


function addMessage(text,type){

const row =
document.createElement("div");

row.className =
"message " + type;

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

row.appendChild(bubble);

chat.appendChild(row);

chat.scrollTop =
chat.scrollHeight;

}


async function sendMessage(){

const text =
input.value.trim();

if(!text)
return;

addMessage(text,"user");

input.value="";

send.disabled=true;

addMessage(
"MAZYAR خەریکی بیرکردنەوەیە... 🤖",
"ai"
);


/*
  لێرە API ـی AI دادەنرێت.
*/

setTimeout(()=>{

const messages =
document.querySelectorAll(".ai .bubble");

messages[messages.length-1].textContent =
"ئەمە تاقیکردنەوەی MAZYAR ـە. بۆ وەڵامی AI ـی ڕاستەقینە، API ـی مۆدێلی AI پێوە دەبەسترێت.";

send.disabled=false;

},1000);

}


function handleKey(event){

if(event.key==="Enter" && !event.shiftKey){

event.preventDefault();

sendMessage();

}

}

</script>

</body>
</html>
```
