    }

    .send-btn:hover {

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .login-card {
        padding: 28px 20px;

      }

  </style>
</head>


<body>

  <!-- ================= LOGIN ================= -->

  <section id="auth">

    <div class="login-card">

      <div class="logo">
        MAZYAR
      </div>

      <div class="tagline">
        Your intelligent AI assistant
      </div>


      <div id="usernameField" class="field hidden">

        <label>
          Username
        </label>

        <input
          id="username"
          type="text"
          placeholder="Your username">

      </div>


      <div class="field">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com">

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••">

      </div>


      <button
        id="authBtn"
        class="primary-btn">

        Sign in

      </button>


      <div class="divider">
        OR
      </div>


      <button
        id="googleBtn"
        class="google-btn">

        Continue with Google

      </button>


      <div
        id="error"
        class="error">
      </div>


      <div class="switch">

        <span id="switchText">
          Don't have an account?
        </span>

        <button id="switchBtn">
          Create account
        </button>

      </div>

    </div>

  </section>


  <!-- ================= CHAT ================= -->

  <section
    id="chat"
    class="hidden">

    <header class="topbar">

      <div class="brand">
        MAZYAR AI
      </div>


      <div class="user-area">

        <span id="userName">
        </span>

        <button
          id="logoutBtn"
          class="logout-btn">

          Logout

        </button>

      </div>

    </header>


    <main
      id="messages"
      class="messages">

      <div class="message ai">

        <div class="bubble">
          Hello 👋
          I am MAZYAR AI.
          How can I help you today?
        </div>

      </div>

    </main>


    <footer class="composer">

      <div class="input-wrap">

        <textarea
          id="question"
          placeholder="Ask MAZYAR anything...">
        </textarea>

        <button
          id="sendBtn"
          class="send-btn">

          Send

        </button>

      </div>

    </footer>

  </section>


  <!-- ================= JAVASCRIPT ================= -->

  <script type="module">

    import {
      createClient
    } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* SUPABASE */

    const SUPABASE_URL =
      "https://lwqdpovamqdmdqftewop.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KRRdhD9dmvwzHZwsmBXbhA_ACxwSR2T";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "pkce"
          }
        }
      );


    /* ELEMENTS */

    const auth =
      document.getElementById("auth");

    const chat =
      document.getElementById("chat");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const username =
      document.getElementById("username");

    const usernameField =
      document.getElementById("usernameField");

    const authBtn =
      document.getElementById("authBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const switchBtn =
      document.getElementById("switchBtn");

    const switchText =
      document.getElementById("switchText");

    const errorBox =
      document.getElementById("error");

    const userName =
      document.getElementById("userName");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const question =
      document.getElementById("question");

    const sendBtn =
      document.getElementById("sendBtn");

    const messages =
      document.getElementById("messages");


    let signUpMode = false;


    /* ERROR */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

    }


    function clearError() {

      errorBox.textContent =
        "";

      errorBox.style.display =
        "none";

    }


    /* LOGIN SCREEN */

    function showLogin() {

      chat.classList.add("hidden");
      auth.classList.remove("hidden");

    }


    /* CHAT SCREEN */

    function showChat(user) {

      auth.classList.add("hidden");
      chat.classList.remove("hidden");


      const name =
        user?.user_metadata?.full_name ||
        user?.user_metadata?.name ||
        user?.user_metadata?.username ||
        user?.email?.split("@")[0] ||
        "User";


      userName.textContent =
        name;

    }


    /* SWITCH LOGIN / SIGNUP */

    switchBtn.addEventListener(
      "click",
      () => {

        signUpMode =
          !signUpMode;


        usernameField.classList.toggle(
          "hidden",
          !signUpMode
        );


        authBtn.textContent =
          signUpMode
            ? "Create account"
            : "Sign in";


        switchText.textContent =
          signUpMode
            ? "Already have an account?"
            : "Don't have an account?";


        switchBtn.textContent =
          signUpMode
            ? "Sign in"
            : "Create account";


        clearError();

      }
    );


    /* EMAIL AUTH */

    authBtn.addEventListener(
      "click",
      async () => {

        clearError();


        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;

        const usernameValue =
          username.value.trim();


        if (!emailValue) {

          showError(
            "Please enter your email."
          );

          return;

        }


        if (!passwordValue) {

          showError(
            "Please enter your password."
          );

          return;

        }


        authBtn.disabled =
          true;


        try {

          if (signUpMode) {

            if (!usernameValue) {

              showError(
                "Please enter a username."
              );

              authBtn.disabled =
                false;

              return;

            }


            const {
              data,
              error
            } =
            await supabase.auth.signUp({

              email:
                emailValue,

              password:
                passwordValue,

              options: {

                data: {
                  username:
                    usernameValue
                },

                emailRedirectTo:
                  "https://mazyar.vercel.app/"

              }

            });


            if (error)
              throw error;


            if (data.session) {

              showChat(
                data.user
              );

            } else {

              showError(
                "Account created. Please confirm your email."
              );

            }

          } else {

            const {
              data,
              error
            } =
            await supabase.auth.signInWithPassword({

              email:
                emailValue,

              password:
                passwordValue

            });


            if (error)
              throw error;


            showChat(
              data.user
            );

          }

        } catch (error) {

          console.error(error);

          showError(
            error.message ||
            "Authentication error."
          );

        }


        authBtn.disabled =
          false;

      }
    );


    /* GOOGLE LOGIN */

    googleBtn.addEventListener(
      "click",
      async () => {

        clearError();

        googleBtn.disabled =
          true;

        googleBtn.textContent =
          "Connecting...";


        try {

          const {
            error
          } =
          await supabase.auth.signInWithOAuth({

            provider:
              "google",

            options: {

              redirectTo:
                "https://mazyar.vercel.app/",

              queryParams: {

                prompt:
                  "select_account"

              }

            }

          });


          if (error)
            throw error;

        } catch (error) {

          console.error(error);

          showError(
            error.message ||
            "Google login failed."
          );


          googleBtn.disabled =
            false;

          googleBtn.textContent =
            "Continue with Google";

        }

      }
    );


    /* SESSION */

    supabase.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event
        );


        if (
          session &&
          session.user
        ) {

          showChat(
            session.user
          );

        } else {

          showLogin();

        }

      }
    );


    async function checkSession() {

      const {
        data
      } =
      await supabase.auth.getSession();


      if (
        data.session &&
        data.session.user
      ) {

        showChat(
          data.session.user
        );

      } else {

        showLogin();

      }

    }


    checkSession();


    /* LOGOUT */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        showLogin();

      }
    );


    /* ADD MESSAGE */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      message.appendChild(
        bubble
      );

      messages.appendChild(
        message
      );


      messages.scrollTop =
        messages.scrollHeight;


      return bubble;

    }


    /* AI */

    async function sendMessage() {

      const text =
        question.value.trim();


      if (!text)
        return;


      addMessage(
        text,
        "user"
      );


      question.value =
        "";


      const answer =
        addMessage(
          "MAZYAR is thinking...",
          "ai"
        );


      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message:
                    text
                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "AI request failed."
          );

        }


        answer.textContent =
          data.answer ||
          "No answer received.";

      } catch (error) {

        console.error(error);

        answer.textContent =
          "Sorry, there is a problem connecting to AI.";

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    question.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
