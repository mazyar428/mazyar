```html
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZYAR AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08080a;
  color:#fff;
  height:100vh;
}

.hidden{display:none!important}

.auth{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#08080a;
}

.card{
  width:420px;
  padding:40px;
  border-radius:25px;
  background:#111;
  border:1px solid #ffffff18;
  box-shadow:0 20px 80px #000;
}

.logo{
  text-align:center;
  font-size:44px;
  font-weight:900;
  letter-spacing:4px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin:10px 0 30px;
}

label{
  display:block;
  font-size:14px;
  color:#ccc;
  margin:13px 0 7px;
}

input{
  width:100%;
  height:50px;
  border:1px solid #ffffff18;
  border-radius:12px;
  background:#ffffff08;

  padding:0 14px;
  outline:none;
}

.primary,
.google-btn{
  width:100%;
  height:50px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  border:0;
  margin-top:20px;
  background:#fff;
  color:#111;
}

.google-btn{
  margin-top:10px;
  border:1px solid #ffffff20;
  background:#fff;
  color:#111;
}

.primary:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#777;
  font-size:13px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#ffffff15;
  flex:1;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#888;
}

.switch button{
  border:0;
  background:none;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.error{
  display:none;
  margin-top:15px;
  padding:11px;
  border-radius:10px;
  background:#ff000018;
  color:#ffaaaa;
  font-size:14px;
}

.chat{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #ffffff12;
  background:#111114;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
}

.account{
  display:flex;
  align-items:center;
  gap:12px;
  color:#aaa;
}

.logout{
  border:1px solid #ffffff20;
  background:#ffffff08;
  color:#fff;
  border-radius:10px;
  padding:9px 14px;
  cursor:pointer;
}

.messages{
  flex:1;
  overflow:auto;
  padding:25px;
}

.message{
  max-width:900px;
  margin:18px auto;
  display:flex;
}

.message.user{
  justify-content:flex-start;
}

.message.ai{
  justify-content:flex-end;
}

.bubble{
  max-width:750px;
  padding:14px 18px;
  border-radius:18px;
  line-height:1.8;
  white-space:pre-wrap;
}

.user .bubble{
  background:#252529;
}

.ai .bubble{
  background:#171719;
  border:1px solid #ffffff10;
}

.composer{
  padding:15px 25px 25px;
}

.inputbox{
  max-width:900px;

  border:1px solid #ffffff12;
}

textarea{
  flex:1;
  height:50px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:12px;
  font-size:16px;
}

.send{
  width:90px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:600px){
  .card{padding:28px 20px}
  .messages{padding:15px 10px}
  .composer{padding:10px}
  .account span{display:none}
}
</style>
</head>

<body>

<section id="auth" class="auth">

  <div class="card">

    <div class="logo">MAZYAR</div>

    <div class="sub">
      هاوڕێی زیرەکی دەستکرد 🤖
    </div>

    <div id="usernameBox" class="hidden">
      <label>ناوی بەکارهێنەر</label>
      <input
        id="username"
        type="text"
        placeholder="ناوی تۆ">
    </div>

    <label>ئیمەیڵ</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="example@gmail.com">

    <label>پاسوۆرد</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••">

    <button
      id="authBtn"
      class="primary"
      onclick="authUser()">
      چوونەژوورەوە
    </button>

    <div class="divider">یان</div>

    <button
      type="button"
      class="google-btn"
      onclick="loginWithGoogle()">
      Continue with Google
    </button>

    <div id="error" class="error"></div>

    <div class="switch">

      <span id="switchText">
        هەژمارت نییە؟
      </span>

      <button onclick="toggleMode()">
        <span id="switchBtn">
          هەژمار دروست بکە
        </span>
      </button>

    </div>

  </div>

</section>


<section id="chat" class="chat hidden">

  <header class="header">

    <div class="brand">
      MAZYAR AI
    </div>

    <div class="account">

      <span id="userName"></span>

      <button
        class="logout"
        onclick="logout()">
        دەرچوون
      </button>

    </div>

  </header>


  <main id="messages" class="messages">

    <div class="message ai">

      <div class="bubble">
        سڵاو 👋 من MAZYAR ـم.
        <br>
        بەخێربێیت! چ پرسیارێکت هەیە؟
      </div>

    </div>

  </main>


  <footer class="composer">

    <div class="inputbox">

      <textarea
        id="question"
        placeholder="پرسیارەکەت بنووسە..."
        onkeydown="keyHandler(event)">
      </textarea>

      <button
        id="sendBtn"
        class="send"
        onclick="sendMessage()">
        ناردن
      </button>

    </div>

  </footer>

</section>


<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://lwqdpovamqdmdqftewop.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KRRdhD9dmvwzHZwsmBXbhA_ACxwSR2T";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let signUp = false;


function showError(message){

  const error =
  document.getElementById("error");

  error.textContent = message;
  error.style.display = "block";

}


function clearError(){

  const error =
  document.getElementById("error");

  error.textContent = "";
  error.style.display = "none";

}


function openAI(user){

  document
    .getElementById("auth")
    .classList
    .add("hidden");

  document
    .getElementById("chat")
    .classList
    .remove("hidden");


  const name =
    user?.user_metadata?.username ||
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email?.split("@")[0] ||
    "هاوڕێ";


  document
    .getElementById("userName")
    .textContent = name;

}


window.toggleMode = function(){

  signUp = !signUp;

  document
    .getElementById("usernameBox")
    .classList
    .toggle("hidden", !signUp);

  document
    .getElementById("authBtn")
    .textContent =
      signUp
      ? "هەژمار دروست بکە"
      : "چوونەژوورەوە";

  document
    .getElementById("switchText")
    .textContent =
      signUp
      ? "هەژمارت هەیە؟"
      : "هەژمارت نییە؟";

  document
    .getElementById("switchBtn")
    .textContent =
      signUp
      ? "چوونەژوورەوە"
      : "هەژمار دروست بکە";

};


window.authUser = async function(){

  clearError();

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  if(!email){
    showError("ئیمەیڵ بنووسە.");
    return;
  }

  if(!password){
    showError("پاسوۆرد بنووسە.");
    return;
  }

  if(signUp && !username){
    showError("ناوی بەکارهێنەر بنووسە.");
    return;
  }


  const btn =
    document.getElementById("authBtn");

  btn.disabled = true;
  btn.textContent = "چاوەڕێ بکە...";


  try{

    if(signUp){

      const {data,error} =
        await supabase.auth.signUp({

          email,
          password,

          options:{
            data:{
              username
            }
          }

        });


      if(error)
        throw error;


      if(data.session){

        openAI(data.user);

      }else{

        showError(
          "هەژمار دروست بوو. تکایە ئیمەیڵەکەت پشتڕاست بکە."
        );

      }


    }else{

      const {data,error} =
        await supabase.auth.signInWithPassword({

          email,
          password

        });


      if(error)
        throw error;


      openAI(data.user);

    }


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "هەڵەیەک ڕوویدا."
    );

  }


  btn.disabled = false;

  btn.textContent =
    signUp
    ? "هەژمار دروست بکە"
    : "چوونەژوورەوە";

};


window.loginWithGoogle = async function(){

  clearError();


  const {error} =
    await supabase.auth.signInWithOAuth({

      provider:"google",

      options:{
        redirectTo:
          "https://mazyar.vercel.app/"
      }

    });


  if(error){

    console.error(error);

    showError(
      error.message ||
      "Google Login هەڵەی هەیە."
    );

  }

};


window.logout = async function(){

  await supabase.auth.signOut();

  location.reload();

};


function addMessage(text,type){

  const row =
    document.createElement("div");

  row.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(bubble);


  const messages =
    document.getElementById("messages");

  messages.appendChild(row);

  messages.scrollTop =
    messages.scrollHeight;


  return bubble;

}


window.sendMessage = async function(){

  const input =
    document.getElementById("question");

  const text =
    input.value.trim();


  if(!text)
    return;


  addMessage(
    text,
    "user"
  );

  input.value = "";


  const answer =
    addMessage(
      "MAZYAR خەریکی بیرکردنەوەیە... 🤖",
      "ai"
    );


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI error"
      );

    }


    answer.textContent =
      data.answer ||
      "وەڵامێک نەهاتەوە.";


  }catch(error){

    console.error(error);

    answer.textContent =
      "ببورە، کێشەیەک لە پەیوەندی بە AI هەیە.";

  }

};


window.keyHandler = function(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

};


/*
  ئەمە زۆر گرنگە:
  هەر کاتێک Google Login یان
  Email Login session دروست دەکات،
  ئەم listener ـە MAZYAR Chat دەکاتەوە.
*/

supabase.auth.onAuthStateChange(
  (event, session) => {

    if(session){

      openAI(
        session.user
      );

    }

  }
);


/*
  ئەگەر پێشتر login بووبێت،
  session ـی هەنووکەیی بخوێنەوە.
*/

const {
  data:{
    session
  }
} =
await supabase.auth.getSession();


if(session){

  openAI(
    session.user
  );

}

</script>

</body>
</html>
